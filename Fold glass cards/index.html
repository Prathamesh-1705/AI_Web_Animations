<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Fold Ticker</title>
  <meta name="description" content="Parametric 3D Glass Fold Ticker with faceted folding screens, chromatic sheen, and realistic perspective curvature.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Interactive Viewport -->
  <main class="ticker-viewport" id="ticker-viewport">
    
    <!-- 3D Perspective Stage -->
    <div class="stage-container" id="stage-container">
      <!-- Facets and image slices are procedurally rendered in 3D by script.js -->
    </div>

    <!-- Soft Ambient Depth Vignette -->
    <div class="ambient-glow" aria-hidden="true"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
